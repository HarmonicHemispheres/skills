<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">skills</title>
  <desc id="d">A collection of Claude skills I use all the time</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0a868"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#dots)"/>

  <!-- wordmark -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="80" y="160" font-size="84" font-weight="700" fill="#e6edf3">
      <tspan fill="url(#accent)">/</tspan>skills
    </text>
    <rect x="418" y="98" width="6" height="68" fill="#d97757">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="84" y="208" font-size="20" fill="#8b949e" letter-spacing="0.5">drop-in instructions that make Claude better at things</text>
  </g>

  <!-- module grid: each skill tile wakes up in turn (10s cycle) -->
  <g transform="translate(780 54)">
    <g fill="#1f2638" stroke="#30363d" stroke-width="2">
      <rect x="0"   y="0"  width="80" height="80" rx="14"/>
      <rect x="96"  y="0"  width="80" height="80" rx="14"/>
      <rect x="192" y="0"  width="80" height="80" rx="14"/>
      <rect x="0"   y="96" width="80" height="80" rx="14"/>
      <rect x="192" y="96" width="80" height="80" rx="14"/>
    </g>
    <rect x="96" y="96" width="80" height="80" rx="14" fill="url(#accent)"/>

    <g stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- chart: erases and redraws -->
      <path d="M22 54 L34 40 L46 48 L58 28" stroke-dasharray="60">
        <animate attributeName="stroke-dashoffset" values="0;0;-60;60;0;0" keyTimes="0;0.02;0.08;0.08;0.16;1" dur="10s" repeatCount="indefinite"/>
      </path>

      <!-- sparkle: twinkles -->
      <g transform="translate(136 40)">
        <path d="M0 -16 Q2 -2 16 0 Q2 2 0 16 Q-2 2 -16 0 Q-2 -2 0 -16Z">
          <animateTransform attributeName="transform" type="scale" values="1;1;1.3;0.9;1;1" keyTimes="0;0.2;0.24;0.27;0.3;1" dur="10s" repeatCount="indefinite"/>
          <animate attributeName="stroke" values="#8b949e;#8b949e;#f0a868;#8b949e;#8b949e" keyTimes="0;0.2;0.24;0.3;1" dur="10s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- doc: lines type out -->
      <line x1="212" y1="24" x2="252" y2="24">
        <animate attributeName="x2" values="252;252;212;252;252" keyTimes="0;0.34;0.34;0.4;1" dur="10s" repeatCount="indefinite"/>
      </line>
      <line x1="212" y1="36" x2="252" y2="36">
        <animate attributeName="x2" values="252;252;212;212;252;252" keyTimes="0;0.34;0.34;0.38;0.44;1" dur="10s" repeatCount="indefinite"/>
      </line>
      <line x1="212" y1="48" x2="252" y2="48">
        <animate attributeName="x2" values="252;252;212;212;252;252" keyTimes="0;0.34;0.34;0.42;0.48;1" dur="10s" repeatCount="indefinite"/>
      </line>
      <line x1="212" y1="60" x2="236" y2="60">
        <animate attributeName="x2" values="236;236;212;212;236;236" keyTimes="0;0.34;0.34;0.46;0.5;1" dur="10s" repeatCount="indefinite"/>
      </line>

      <!-- graph: a signal travels between nodes -->
      <path d="M24 154 L40 118 L56 154" stroke="#3d4658"/>
      <circle cx="24" cy="154" r="5"/>
      <circle cx="40" cy="118" r="5"/>
      <circle cx="56" cy="154" r="5"/>

      <!-- clock: hand sweeps a full turn -->
      <circle cx="232" cy="136" r="16"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 232 136;0 232 136;360 232 136;360 232 136" keyTimes="0;0.84;0.96;1" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.5 0 0.3 1;0 0 1 1"/>
        <path d="M232 128 v8 l6 4"/>
      </g>
    </g>

    <circle r="3.5" fill="#f0a868" opacity="0">
      <animateMotion path="M24 154 L40 118 L56 154" keyPoints="0;0;1;1" keyTimes="0;0.52;0.64;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.53;0.63;0.64;1" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- check: stays put, redraws its stroke -->
    <path d="M120 136 l10 10 l22 -22" stroke="#0d1117" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="46">
      <animate attributeName="stroke-dashoffset" values="0;0;46;46;0;0" keyTimes="0;0.68;0.7;0.72;0.8;1" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- baseline accent -->
  <rect x="84" y="236" width="56" height="4" rx="2" fill="url(#accent)"/>
</svg>
