<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">skills</title>
  <desc id="d">A collection of Claude skills I use all the time</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0a868"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#dots)"/>

  <!-- wordmark -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="80" y="160" font-size="84" font-weight="700" fill="#e6edf3">
      <tspan fill="url(#accent)">/</tspan>skills
    </text>
    <rect x="418" y="98" width="6" height="68" fill="#d97757">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="84" y="208" font-size="20" fill="#8b949e" letter-spacing="0.5">drop-in instructions that make Claude better at things</text>
  </g>

  <!-- module grid: skills snapping into place -->
  <g transform="translate(780 54)">
    <g fill="none" stroke="#30363d" stroke-width="2">
      <rect x="0"   y="0"   width="80" height="80" rx="14"/>
      <rect x="96"  y="0"   width="80" height="80" rx="14"/>
      <rect x="192" y="0"   width="80" height="80" rx="14"/>
      <rect x="0"   y="96"  width="80" height="80" rx="14"/>
      <rect x="192" y="96"  width="80" height="80" rx="14"/>
      <rect x="96"  y="96"  width="80" height="80" rx="14" stroke-dasharray="6 6"/>
    </g>
    <rect x="0" y="0" width="80" height="80" rx="14" fill="#1f2638"/>
    <rect x="192" y="96" width="80" height="80" rx="14" fill="#1f2638"/>

    <!-- icons on filled tiles -->
    <g stroke="#8b949e" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M22 54 L34 40 L46 48 L58 28"/>
      <circle cx="232" cy="136" r="16"/>
      <path d="M232 128 v8 l6 4"/>
    </g>

    <!-- the active skill sliding into its slot -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="60 -60; 0 0; 0 0; 60 -60" keyTimes="0;0.25;0.85;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1; 0 0 1 1; 0.8 0 0.8 0.2"/>
      <rect x="96" y="96" width="80" height="80" rx="14" fill="url(#accent)"/>
      <g stroke="#0d1117" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M120 136 l10 10 l22 -22"/>
      </g>
    </g>
  </g>

  <!-- baseline accent -->
  <rect x="84" y="236" width="56" height="4" rx="2" fill="url(#accent)"/>
</svg>
