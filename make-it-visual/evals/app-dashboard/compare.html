<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>make-it-visual · A/B</title>
<!-- Generated by measure.py from compare_template.html. Edit the template, not compare.html. -->
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --ink: #111827; --ink-2: #4b5563; --ink-3: #9ca3af; --line: #e5e7eb;
    --accent: #0f766e; --accent-soft: #e6f4f2;
    --good: #15803d; --good-soft: #dcfce7; --bad: #b91c1c; --bad-soft: #fee2e2;
    --radius: 14px; --shadow: 0 1px 2px rgba(17,24,39,.04), 0 8px 24px -12px rgba(17,24,39,.12);
    --ease-out: cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, "Segoe UI", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; }
  .ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ic.sm { width: 15px; height: 15px; }

  /* type scale: display, body, caption */
  .display { font-size: 34px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .caption { font-size: 12.5px; color: var(--ink-2); }

  main { max-width: 1280px; margin: 0 auto; padding: 32px 32px 56px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  h1 { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin: 2px 0 0; }
  h2 { font-size: 15px; font-weight: 650; margin: 0; }

  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 16px; }
  .pair { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card-head .spacer { flex: 1; }

  .kpi .value { color: var(--accent); margin: 6px 0 4px; }
  .kpi .row { display: flex; align-items: center; gap: 8px; }
  .delta { font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--good-soft); color: var(--good); }
  .delta.worse { background: var(--bad-soft); color: var(--bad); }

  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--bg); color: var(--ink-2); }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .link { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-2); text-decoration: none; }
  .link:hover { color: var(--ink); }
  .frame { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
  .frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
  .with .frame { outline: 2px solid var(--accent); outline-offset: 2px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
  thead th { border-top: 0; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; width: 190px; }
  td.better { font-weight: 650; }
  .mark { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; vertical-align: middle; }
  .mark.pass { background: var(--good-soft); color: var(--good); }
  .mark.fail { background: var(--bad-soft); color: var(--bad); }
  .swatches { display: inline-flex; gap: 4px; vertical-align: middle; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }

  /* info popups: hover on desktop, click/tap and keyboard everywhere */
  .tip { position: relative; display: inline-flex; }
  .tip-btn { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: var(--ink-3); transition: color .15s var(--ease-out), background .15s var(--ease-out); }
  .tip-btn:hover, .tip.open .tip-btn { color: var(--accent); background: var(--accent-soft); }
  .tip-pop { position: absolute; z-index: 10; top: calc(100% + 6px); left: 50%; width: 280px; transform: translate(-50%, 4px);
    background: var(--ink); color: #f9fafb; font-size: 12.5px; line-height: 1.5; padding: 10px 12px; border-radius: 10px;
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .18s var(--ease-out), transform .18s var(--ease-out), visibility .18s; text-align: left; font-weight: 400; white-space: normal; }
  .tip.right .tip-pop { left: auto; right: 0; transform: translate(0, 4px); }
  .tip:hover .tip-pop, .tip.open .tip-pop { opacity: 1; visibility: visible; pointer-events: auto; transform: translate(-50%, 0); }
  .tip.right:hover .tip-pop, .tip.right.open .tip-pop { transform: translate(0, 0); }

  .rise { opacity: 0; transform: translateY(8px); animation: rise .45s var(--ease-out) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  footer { margin-top: 20px; display: flex; align-items: center; gap: 6px; }

  @media (max-width: 900px) {
    main { padding: 20px 16px 40px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pair { grid-template-columns: 1fr; }
    td.num, th.num { width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; opacity: 1; transform: none; }
    .tip-pop, .tip-btn { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="caption">make-it-visual · A/B test</div>
      <h1>Same prompt, two dashboards</h1>
    </div>
    <span class="tip right" id="prompt-tip"></span>
  </header>

  <section class="grid kpis" id="kpis"></section>
  <section class="grid pair" id="frames"></section>

  <section class="card rise" style="margin-bottom:16px">
    <div class="card-head"><h2 id="score-title"></h2><span class="spacer"></span><span id="score-tip"></span></div>
    <table id="score"></table>
  </section>

  <section class="card rise">
    <div class="card-head"><h2>Measured side by side</h2></div>
    <table id="metrics"></table>
  </section>

  <footer class="caption" id="footer"></footer>
</main>

<script>
const DATA = {"prompt": "Build the home dashboard for Pulse, a web app that restaurant owners use to manage online orders. This is the first screen an owner sees when they log in during a busy lunch service. It should show today's orders, revenue, average prep time and customer rating; how order volume has trended over the last 14 days; where current orders are in the pipeline (received → preparing → ready → picked up); the most recent orders and their status; and the top-selling menu items this week. Most owners aren't technical, so explain what each metric means and include a few tips for getting the most out of the dashboard. Use realistic mock data. Make it a single self-contained HTML file (no build step; CDN libraries are fine) and save it as dashboard.html.", "date": "2026-09-18", "viewport": {"width": 1440, "height": 900}, "runs": [{"id": "without_skill", "label": "Without skill", "metrics": {"visible_words": 714, "popup_words": 660, "popups_opened": 9, "popup_triggers": 9, "popups_open_via": ["click"], "longest_block_words": 27, "longest_block_text": "You've taken 87 orders so far, 12% more than last Friday at this time. 12 are in the kitchen or waiting for pickup, and 2 need attention.", "blocks_over_25_words": 1, "text_sizes": ["34px", "32px", "26px", "17px", "15px", "14px", "13.5px", "13px", "12.5px", "12px", "11.5px", "11px", "10.5px"], "emoji": [], "icons": 46, "page_height_px": 2389, "screens_tall": 2.7, "has_motion": true, "reduced_motion": true, "saturated_share": 0.0209, "color_families": [{"hex": "#e2754b", "share": 0.942}, {"hex": "#2e8e5a", "share": 0.035}, {"hex": "#3f73d6", "share": 0.023}], "file_kb": 77.4, "timing": {"total_tokens": 169308, "duration_ms": 997594, "total_duration_seconds": 997.6}}, "expectations": [{"text": "No paragraphs: every visible text block is 25 words or fewer", "passed": false, "evidence": "1 blocks over 25 words; longest is 27: \"You've taken 87 orders so far, 12% more than last Friday at this time. 12 are in the kitchen or wait\""}, {"text": "Explanations and tips are on demand: popups reveal 30+ words", "passed": true, "evidence": "9 popups revealed 660 words; 714 words always visible"}, {"text": "Info popups open on click or tap, not hover only", "passed": true, "evidence": "9 of 9 info triggers opened via click"}, {"text": "Type scale: 3 text sizes or fewer (display, body, caption)", "passed": false, "evidence": "13 sizes: 34px, 32px, 26px, 17px, 15px, 14px, 13.5px, 13px, 12.5px, 12px, 11.5px, 11px, 10.5px"}, {"text": "Motion respects prefers-reduced-motion", "passed": true, "evidence": "Has a prefers-reduced-motion rule"}, {"text": "No emoji used as icons", "passed": true, "evidence": "No emoji in visible text"}, {"text": "Accent discipline: saturated color covers 10% of the page or less", "passed": true, "evidence": "2.1% of pixels are strongly saturated"}, {"text": "At most 4 color families (one accent plus good, warning, bad)", "passed": true, "evidence": "3 families: #e2754b 94%, #2e8e5a 4%, #3f73d6 2%"}], "summary": {"passed": 6, "failed": 2, "total": 8, "pass_rate": 0.75}}, {"id": "with_skill", "label": "With make-it-visual", "metrics": {"visible_words": 332, "popup_words": 241, "popups_opened": 9, "popup_triggers": 9, "popups_open_via": ["focus"], "longest_block_words": 8, "longest_block_text": "#1055 and #1057 are past their ready time", "blocks_over_25_words": 0, "text_sizes": ["28px", "15px", "12px"], "emoji": [], "icons": 51, "page_height_px": 1971, "screens_tall": 2.2, "has_motion": true, "reduced_motion": true, "saturated_share": 0.0248, "color_families": [{"hex": "#535ddb", "share": 0.74}, {"hex": "#d29557", "share": 0.19}, {"hex": "#a2383d", "share": 0.028}], "file_kb": 51.7, "timing": {"total_tokens": 204434, "duration_ms": 1204483, "total_duration_seconds": 1204.5}}, "expectations": [{"text": "No paragraphs: every visible text block is 25 words or fewer", "passed": true, "evidence": "0 blocks over 25 words; longest is 8: \"#1055 and #1057 are past their ready time\""}, {"text": "Explanations and tips are on demand: popups reveal 30+ words", "passed": true, "evidence": "9 popups revealed 241 words; 332 words always visible"}, {"text": "Info popups open on click or tap, not hover only", "passed": true, "evidence": "9 of 9 info triggers opened via focus"}, {"text": "Type scale: 3 text sizes or fewer (display, body, caption)", "passed": true, "evidence": "3 sizes: 28px, 15px, 12px"}, {"text": "Motion respects prefers-reduced-motion", "passed": true, "evidence": "Has a prefers-reduced-motion rule"}, {"text": "No emoji used as icons", "passed": true, "evidence": "No emoji in visible text"}, {"text": "Accent discipline: saturated color covers 10% of the page or less", "passed": true, "evidence": "2.5% of pixels are strongly saturated"}, {"text": "At most 4 color families (one accent plus good, warning, bad)", "passed": true, "evidence": "3 families: #535ddb 74%, #d29557 19%, #a2383d 3%"}], "summary": {"passed": 8, "failed": 0, "total": 8, "pass_rate": 1.0}}]};

const ICONS = {
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  open: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/>',
};
const icon = (name, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tip = (label, body, extra = '') =>
  `<span class="tip ${extra}"><button class="tip-btn" aria-label="${esc(label)}" aria-expanded="false">${icon('info', 'sm')}</button><span class="tip-pop" role="tooltip">${body}</span></span>`;
const pct = x => `${Math.round(x * 1000) / 10}%`;

const base = DATA.runs.find(r => r.id === 'without_skill');
const skill = DATA.runs.find(r => r.id === 'with_skill');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Prompt, behind a popup.
document.getElementById('prompt-tip').outerHTML =
  `<span class="tip right"><button class="chip" aria-label="Show the prompt" aria-expanded="false">${icon('file', 'sm')} Prompt</button>` +
  `<span class="tip-pop" role="tooltip" style="width:420px">${esc(DATA.prompt)}</span></span>`;

// KPI tiles: skill value big, baseline small.
const KPIS = [
  { label: 'Visible words', get: m => m.visible_words, fmt: v => v, lower: true,
    info: 'Words a viewer sees without opening anything. Chart labels excluded.' },
  { label: 'Longest text block', get: m => m.longest_block_words, fmt: v => v, unit: 'words', lower: true,
    info: 'The biggest single run of prose. The skill caps card bodies at one sentence.' },
  { label: 'Checks passed', get: (m, r) => r.summary.passed, fmt: v => `${v}/${skill.summary.total}`, lower: false,
    info: 'Pass/fail checks taken from SKILL.md rules. See the scorecard below.' },
  { label: 'Text sizes', get: m => m.text_sizes.length, fmt: v => v, lower: true,
    info: 'Distinct font sizes in visible text, chart labels excluded. The skill allows three: display, body, caption.' },
];
document.getElementById('kpis').innerHTML = KPIS.map((k, i) => {
  const a = k.get(skill.metrics, skill), b = k.get(base.metrics, base);
  const change = b ? (a - b) / b : 0;
  const better = k.lower ? a <= b : a >= b;
  const delta = k.label === 'Checks passed' ? `${a - b >= 0 ? '+' : ''}${a - b}` : `${change > 0 ? '+' : ''}${Math.round(change * 100)}%`;
  return `<div class="card kpi rise" style="animation-delay:${i * 60}ms">
    <div class="card-head" style="margin:0"><span class="caption">${k.label}</span><span class="spacer"></span>${tip('About ' + k.label, k.info)}</div>
    <div class="display value" data-to="${a}" data-fmt="${i}">${k.fmt(a)}</div>
    <div class="row"><span class="delta ${better ? '' : 'worse'}">${delta}</span><span class="caption">vs ${k.fmt(b)} without${k.unit ? ' · ' + k.unit : ''}</span></div>
  </div>`;
}).join('');

// Live dashboards, scaled to fit.
document.getElementById('frames').innerHTML = [base, skill].map(r => `
  <div class="card rise ${r.id === 'with_skill' ? 'with' : ''}">
    <div class="card-head">
      <span class="chip ${r.id === 'with_skill' ? 'accent' : ''}">${esc(r.label)}</span>
      <span class="caption">${r.summary.passed}/${r.summary.total} checks</span>
      <span class="spacer"></span>
      <a class="link" href="${r.id}/full.png" target="_blank">Full page</a>
      <a class="link" href="${r.id}/dashboard.html" target="_blank">Open ${icon('open', 'sm')}</a>
    </div>
    <div class="frame"><iframe src="${r.id}/dashboard.html" title="${esc(r.label)} dashboard" loading="lazy"
      width="${DATA.viewport.width}" height="${DATA.viewport.height}"></iframe></div>
  </div>`).join('');
function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const s = f.clientWidth / DATA.viewport.width;
    f.style.height = `${DATA.viewport.height * s}px`;
    f.querySelector('iframe').style.transform = `scale(${s})`;
  });
}
addEventListener('resize', fit);
fit();

// Scorecard.
document.getElementById('score-title').textContent =
  `Skill passes ${skill.summary.passed} of ${skill.summary.total} checks, baseline ${base.summary.passed}`;
document.getElementById('score-tip').outerHTML = tip('How checks work',
  'Each check is one SKILL.md rule, measured in headless Chrome by measure.py. Tap a result to see the evidence.', 'right');
const mark = (e, label) => `<span class="tip right"><button class="mark ${e.passed ? 'pass' : 'fail'}" aria-label="${label}: ${e.passed ? 'pass' : 'fail'}" aria-expanded="false">${icon(e.passed ? 'check' : 'x', 'sm')}</button><span class="tip-pop" role="tooltip">${esc(e.evidence)}</span></span>`;
document.getElementById('score').innerHTML =
  `<thead><tr><th>Check</th><th class="num">${esc(base.label)}</th><th class="num">${esc(skill.label)}</th></tr></thead><tbody>` +
  skill.expectations.map((e, i) => `<tr><td>${esc(e.text)}</td><td class="num">${mark(base.expectations[i], base.label)}</td><td class="num">${mark(e, skill.label)}</td></tr>`).join('') +
  '</tbody>';

// Raw measurements.
const swatches = m => `<span class="swatches">${m.color_families.map(f => `<span class="swatch" style="background:${f.hex}" title="${f.hex} ${pct(f.share)}"></span>`).join('')}</span> ${m.color_families.length}`;
const secs = m => m.timing ? `${Math.round(m.timing.total_duration_seconds)}s` : '–';
const toks = m => m.timing ? `${Math.round(m.timing.total_tokens / 1000)}k` : '–';
const ROWS = [
  ['Visible words', m => m.visible_words, 'low'],
  ['Words behind popups', m => m.popup_words],
  ['Words per popup', m => m.popups_opened ? Math.round(m.popup_words / m.popups_opened) : null, 'low'],
  ['Longest text block', m => m.longest_block_words, 'low', ' words'],
  ['Page length', m => m.screens_tall, 'low', '', null, m => `${m.screens_tall} screen${m.screens_tall === 1 ? '' : 's'}`],
  ['Icons (SVG)', m => m.icons],
  ['Distinct text sizes', m => m.text_sizes.length, 'low'],
  ['Saturated color', m => m.saturated_share, 'low', '', pct],
  ['Color families', m => m.color_families.length, 'low', '', null, swatches],
  ['File size', m => m.file_kb, null, ' KB'],
  ['Time to build', m => m.timing && m.timing.total_duration_seconds, null, '', null, secs],
  ['Tokens used', m => m.timing && m.timing.total_tokens, null, '', null, toks],
];
document.getElementById('metrics').innerHTML =
  `<thead><tr><th>Metric</th><th class="num">${esc(base.label)}</th><th class="num">${esc(skill.label)}</th></tr></thead><tbody>` +
  ROWS.map(([label, get, dir, unit = '', fmt, html]) => {
    const cell = r => {
      const v = get(r.metrics), o = get((r === skill ? base : skill).metrics);
      const better = dir === 'low' && v != null && o != null && v < o;
      const shown = html ? html(r.metrics) : (v == null ? '–' : (fmt ? fmt(v) : v) + unit);
      return `<td class="num ${better ? 'better' : ''}">${shown}</td>`;
    };
    return `<tr><td>${label}</td>${cell(base)}${cell(skill)}</tr>`;
  }).join('') + '</tbody>';

document.getElementById('footer').innerHTML =
  `One run per side · ${DATA.date} · ${DATA.viewport.width}×${DATA.viewport.height} viewport ` +
  tip('Method', 'Both runs got the identical prompt in a fresh agent. The with-skill run read make-it-visual/SKILL.md; the baseline could not load any skill. Rerun with measure.py.');

// Popups: click/tap toggles, Escape or outside click closes.
document.addEventListener('click', e => {
  const btn = e.target.closest('.tip > button');
  document.querySelectorAll('.tip.open').forEach(t => {
    if (!btn || t !== btn.parentElement) { t.classList.remove('open'); t.firstElementChild.setAttribute('aria-expanded', 'false'); }
  });
  if (btn) {
    const open = btn.parentElement.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(open));
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.tip.open').forEach(t => t.classList.remove('open'));
});

// Count up KPI numbers once.
if (!reduced) {
  document.querySelectorAll('.value[data-to]').forEach(el => {
    const to = Number(el.dataset.to), fmt = KPIS[el.dataset.fmt].fmt, t0 = performance.now();
    const isInt = Number.isInteger(to);
    const step = now => {
      const p = Math.min(1, (now - t0) / 600), e = 1 - Math.pow(1 - p, 3);
      const v = to * e;
      el.textContent = fmt(isInt ? Math.round(v) : v);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
</script>
</body>
</html>
